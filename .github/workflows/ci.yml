name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, guards, accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A disposable Postgres for the snapshot store tests. It lives only for
    # this job, holds no data and accepts local connections without a
    # password.
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out (full history, for the fresh-history check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (flags, access rules, guards, fresh tree, snapshot store on Postgres)
        run: npm test
        env:
          SNAPSHOT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres

      - name: Require the private-identifier secret
        run: node scripts/check-private-config.mjs
        env:
          PRIVATE_IDENTIFIERS: ${{ secrets.PRIVATE_IDENTIFIERS }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Copy, claim and secret guards
        run: npm run guard
        env:
          # Repository secret: comma-separated private identifiers to keep out.
          PRIVATE_IDENTIFIERS: ${{ secrets.PRIVATE_IDENTIFIERS }}

      - name: Secret scan
        run: npm run secrets

      - name: Marrs Rover release checks (privacy scan, verifier accepts MR-48, rejects tampered, golden vectors)
        run: npm run ledger
        env:
          PRIVATE_IDENTIFIERS: ${{ secrets.PRIVATE_IDENTIFIERS }}

      - name: Build
        run: npm run build

      # Also proves the landing release builds: its release check runs first.
      - name: Build the landing release with the proxy off (test only, for the route-level gate)
        run: npm run build:noproxy

      # A package mirror can stall this step for the whole job (it once hung
      # for 20 minutes). Each attempt gets 5 minutes; a failed or timed-out
      # first attempt gets one retry.
      - name: Install Chromium for Playwright
        id: chromium
        continue-on-error: true
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Chromium for Playwright (retry)
        if: steps.chromium.outcome != 'success'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: End-to-end (routes, keyboard, flags, legacy URLs, axe, rendered copy)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
